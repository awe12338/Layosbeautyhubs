

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Layos Beauty Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<!-- LOGIN SECTION -->
<div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">

  <h2 class="text-2xl font-bold mb-4 text-blue-600">
    Admin Login
  </h2>

  <input type="password" id="adminPassword"
  placeholder="Enter Admin Password"
  class="w-full p-3 border rounded mb-4">

  <button onclick="checkPassword()"
  class="bg-blue-600 text-white w-full py-3 rounded">
  Login
  </button>

</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">

<h1 class="text-3xl font-bold mb-6 text-blue-600">
Admin Panel – Add Product
</h1>

<div class="bg-white p-6 rounded-xl shadow-md mb-8 max-w-xl">
  
  <input id="name" placeholder="Product Name"
  class="w-full p-3 border rounded mb-3">

  <input id="image" placeholder="Image URL"
  class="w-full p-3 border rounded mb-3">

  <select id="category"
  class="w-full p-3 border rounded mb-3">
    <option>Skin Care</option>
    <option>Hair Care</option>
    <option>Makeup</option>
    <option>Jewelries</option>
  </select>

  <button onclick="addProduct()"
  class="bg-blue-600 text-white px-6 py-3 rounded w-full">
  Add Product
  </button>

</div>

<h2 class="text-xl font-bold mb-4">All Products</h2>
<div id="productList" class="grid gap-4"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyBPNuTAFLG3QtOwHdrvvEbUR34bVrJHCFA",
  authDomain: "layos-beauty-hub.firebaseapp.com",
  projectId: "layos-beauty-hub",
  storageBucket: "layos-beauty-hub.firebasestorage.app",
  messagingSenderId: "1070014027832",
  appId: "1:1070014027832:web:1979a9f2af322aa7932ecd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productList = document.getElementById("productList");

/* 🔐 CHANGE THIS PASSWORD */
const ADMIN_PASSWORD = "layos123";

window.checkPassword = function(){

  const entered = document.getElementById("adminPassword").value;

  if(entered === ADMIN_PASSWORD){
    document.getElementById("loginSection").style.display="none";
    document.getElementById("adminPanel").style.display="block";
    loadProducts();
  }else{
    alert("Wrong Password!");
  }
};

window.addProduct = async function(){

  const name = document.getElementById("name").value;
  const image = document.getElementById("image").value;
  const category = document.getElementById("category").value;

  if(!name || !image){
    alert("Please fill all fields");
    return;
  }

  await addDoc(collection(db, "products"), {
    name,
    image,
    category
  });

  alert("Product Added Successfully!");

  document.getElementById("name").value="";
  document.getElementById("image").value="";

  loadProducts();
};

async function loadProducts(){
  productList.innerHTML="";
  const querySnapshot = await getDocs(collection(db, "products"));

  querySnapshot.forEach((document) => {
    const p = document.data();

    productList.innerHTML += `
      <div class="bg-white p-4 rounded shadow flex justify-between items-center">
        <div>
          <p class="font-bold">${p.name}</p>
          <img src="${p.image}" class="w-20 mt-2 rounded">
        </div>
        <button onclick="deleteProduct('${document.id}')"
        class="bg-red-500 text-white px-4 py-2 rounded">
        Delete
        </button>
      </div>
    `;
  });
}

window.deleteProduct = async function(id){
  await deleteDoc(doc(db, "products", id));
  loadProducts();
};

</script>

</body>
</html>
