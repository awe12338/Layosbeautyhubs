<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore | Layo’s Beauty Hub</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ===== KEEPING YOUR ORIGINAL DESIGN EXACTLY ===== */
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,sans-serif;background:#f5f3ff;}
header{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);z-index:1000;}
.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
.logo{display:flex;align-items:center;gap:10px;}
.logo img{width:38px;height:38px;border-radius:50%;}
.logo a{font-size:1.1rem;font-weight:800;color:rgba(5,5,247,.8);text-decoration:none;}
.logo p{font-size:.75rem;color:#666;}
.nav-links{display:none;gap:26px;}
.nav-links a{text-decoration:none;color:#444;font-weight:600;}
.hamburger-btn{font-size:1.6rem;background:none;border:none;cursor:pointer;}
.mobile-menu{position:fixed;top:0;left:0;width:260px;height:100vh;background:#fff;padding:80px 20px;transform:translateX(-100%);transition:.35s ease;z-index:1001;}
.mobile-menu.active{transform:translateX(0);}
.mobile-close-btn{position:absolute;top:16px;right:16px;font-size:1.4rem;background:none;border:none;}
.mobile-nav{display:flex;flex-direction:column;gap:14px;}
.mobile-nav a{padding:12px;border-radius:10px;font-weight:600;color:rgba(5,5,247,.8);text-decoration:none;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:1000;}
.overlay.active{opacity:1;pointer-events:auto;}
main{max-width:1200px;margin:auto;padding:20px;}
h1{font-family:"Playfair Display",serif;font-size:3rem;font-weight:800;color:#1f4fff;margin-bottom:18px;}
#controls{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;}
#controls input,#controls select{width:100%;padding:14px;border-radius:14px;border:1.5px solid #dcd9ff;}
#grid{display:grid;grid-template-columns:1fr;gap:18px;}
.product-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.12);}
.product-card img{width:100%;height:220px;object-fit:cover;}
.card-body{padding:16px;}
.card-body h3{font-size:1rem;font-weight:800;margin-bottom:12px;}
.card-body button{flex:1;padding:12px;border-radius:14px;background:#4f46e5;color:#fff;border:none;font-weight:700;cursor:pointer;}
footer{background:rgba(5,5,247,.8);color:#fff;text-align:center;padding:22px;margin-top:40px;}
@media(min-width:640px){#grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px){.nav-links{display:flex}.hamburger-btn{display:none}#controls{flex-direction:row}}
@media(min-width:1024px){#grid{grid-template-columns:repeat(4,1fr)}}
.support-call{position:fixed;bottom:20px;right:20px;width:58px;height:58px;background:#1f4fff;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 10px 25px rgba(0,0,0,.25);z-index:2000;}
</style>
</head>

<body>

<a href="tel:+2349025863408" class="support-call">📞</a>

<header>
  <div class="nav">
    <div class="logo">
      <img src="logo.png">
      <div>
        <a href="index.html">LAYOS BEAUTY HUB</a>
        <p>Elegance • Glow • Confidence</p>
      </div>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button id="mobileBtn" class="hamburger-btn">☰</button>
  </div>
</header>

<div id="overlay" class="overlay"></div>

<div id="mobileMenu" class="mobile-menu">
  <button id="mobileClose" class="mobile-close-btn">✕</button>
  <nav class="mobile-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="explore.html">Explore</a>
    <a href="contact.html">Contact</a>
  </nav>
</div>

<main>
<h1>Explore Available Products</h1>

<div id="controls">
  <input type="text" id="search" placeholder="Search products...">
  <select id="filter">
    <option value="all">All Categories</option>
    <option>Skin Care</option>
    <option>Hair Care</option>
    <option>Makeup</option>
    <option>Jewelries</option>
  </select>
</div>

<div id="grid"></div>
</main>

<footer>
© 2025 LAYOS BEAUTY HUB | Developed by VT DESIGN
</footer>

<!-- ================= FIREBASE ================= -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyBPNuTAFLG3QtOwHdrvvEbUR34bVrJHCFA",
  authDomain: "layos-beauty-hub.firebaseapp.com",
  projectId: "layos-beauty-hub"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const filter = document.getElementById("filter");

let products = [];

async function loadProducts() {
  const querySnapshot = await getDocs(collection(db, "products"));
  products = [];
  querySnapshot.forEach(doc => {
    products.push(doc.data());
  });
  render();
}

function render() {
  grid.innerHTML = "";
  products
    .filter(p => p.name.toLowerCase().includes(search.value.toLowerCase()))
    .filter(p => filter.value === "all" || p.category === filter.value)
    .forEach(p => {
      grid.innerHTML += `
        <article class="product-card">
          <img src="${p.image}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <div style="display:flex; gap:8px;">
              <button onclick="messageProduct('${p.name}')">Message</button>
              <button onclick="shareProduct('${p.name}')" style="background:#0f2fe0;">Share</button>
            </div>
          </div>
        </article>`;
    });
}

search.addEventListener("input", render);
filter.addEventListener("change", render);

loadProducts();

/* WhatsApp */
window.messageProduct = function(productName){
  const phone = "2349025863408";
  const text = `Hello, I am interested in "${productName}" from Layos Beauty Hub`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,"_blank");
}

/* Share */
window.shareProduct = function(productName){
  const text = `Check out "${productName}" on Layos Beauty Hub`;
  const url = window.location.href;

  if(navigator.share){
    navigator.share({title:productName,text,url});
  }else{
    window.open(`https://wa.me/?text=${encodeURIComponent(text+" "+url)}`,"_blank");
  }
}

/* Mobile Menu */
const btn=document.getElementById("mobileBtn");
const mobileMenu=document.getElementById("mobileMenu");
const closeBtn=document.getElementById("mobileClose");
const overlay=document.getElementById("overlay");

btn.onclick=()=>{mobileMenu.classList.add("active");overlay.classList.add("active");};
closeBtn.onclick=overlay.onclick=()=>{mobileMenu.classList.remove("active");overlay.classList.remove("active");};

</script>

</body>
</html>
